<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Three.js Obby Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }
        #win-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: gold;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid white;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="ui">
    Level: <span id="levelDisplay">1</span>/3<br>
    Coins: <span id="scoreDisplay">0</span>
</div>

<div id="instructions">
    WASD oder Pfeiltasten zum Bewegen | LEERTASTE zum Springen
</div>

<div id="win-screen">
    <h1>GEWONNEN!</h1>
    <p>Du hast alle 3 Stages geschafft.</p>
    <p>Coins gesammelt: <span id="finalScore">0</span></p>
    <button onclick="location.reload()">Nochmal spielen</button>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- GLOBALE VARIABLEN ---
    let scene, camera, renderer;
    let player;
    let platforms = [];
    let coins = [];
    let activeLevel = 1;
    let score = 0;
    
    // Physik Variablen
    const playerSpeed = 0.15;
    const jumpForce = 0.35;
    const gravity = 0.015;
    let velocityY = 0;
    let canJump = false;
    let keyState = {};

    // Kamera "Schwung" Variablen
    const cameraOffset = new THREE.Vector3(0, 5, 10);
    const cameraLerpFactor = 0.1; // Wie stark die Kamera "nachzieht" (0.1 = weich, 1.0 = starr)

    // --- INITIALISIERUNG ---
    function init() {
        // Szene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Himmelblau
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        // Kamera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // Spieler erstellen
        createPlayer();

        // Level 1 laden
        loadLevel(1);

        // Event Listener
        window.addEventListener('resize', onWindowResize);
        document.addEventListener('keydown', (e) => keyState[e.code] = true);
        document.addEventListener('keyup', (e) => keyState[e.code] = false);

        animate();
    }

    function createPlayer() {
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0xff0055 });
        player = new THREE.Mesh(geometry, material);
        player.castShadow = true;
        player.position.y = 2;
        scene.add(player);
    }

    // --- LEVEL DESIGN ---
    function loadLevel(level) {
        // Alte Plattformen und Coins entfernen
        platforms.forEach(p => scene.remove(p));
        coins.forEach(c => scene.remove(c));
        platforms = [];
        coins = [];
        
        // Spieler Reset
        player.position.set(0, 2, 0);
        velocityY = 0;
        activeLevel = level;
        document.getElementById('levelDisplay').innerText = level;

        // Plattform Generator Helfer
        const createPlat = (x, y, z, w, d, color) => {
            const geo = new THREE.BoxGeometry(w, 1, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push(mesh); // Zur Kollisionsliste hinzufügen
            
            // Box3 für exakte Kollision speichern
            mesh.geometry.computeBoundingBox();
        };

        const createCoin = (x, y, z) => {
            const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(x, y, z);
            scene.add(coin);
            coins.push(coin);
        };

        // Startplattform (immer gleich)
        createPlat(0, 0, 0, 4, 4, 0x444444);

        if (level === 1) {
            // Stage 1: Grün, einfach
            const c = 0x4CAF50;
            createPlat(0, 0, -6, 3, 4, c);
            createCoin(0, 1.5, -6);
            createPlat(0, 1, -12, 3, 3, c);
            createPlat(2, 2, -18, 2, 2, c);
            createCoin(2, 3.5, -18);
            createPlat(-2, 3, -24, 2, 2, c);
            // Ziel
            createPlat(0, 3, -32, 6, 6, 0xFFFFFF); 
        } 
        else if (level === 2) {
            // Stage 2: Blau, mittlere Sprünge
            const c = 0x2196F3;
            createPlat(0, 0, -6, 2, 2, c);
            createPlat(0, 0, -11, 2, 2, c); // Weiter Sprung
            createCoin(0, 1.5, -11);
            createPlat(3, 1, -15, 2, 2, c);
            createPlat(-3, 2, -20, 1.5, 1.5, c);
            createCoin(-3, 3.5, -20);
            createPlat(0, 3, -25, 1.5, 6, c); // Steg
            // Ziel
            createPlat(0, 3, -32, 6, 6, 0xFFFFFF);
        }
        else if (level === 3) {
            // Stage 3: Rot, schwer (kleine Plattformen, Höhenunterschiede)
            const c = 0xF44336;
            createPlat(0, 1, -6, 1.5, 1.5, c);
            createPlat(0, 2, -11, 1.2, 1.2, c);
            createCoin(0, 3.5, -11);
            createPlat(0, 1, -16, 1.2, 1.2, c); // Runterfallen
            createPlat(3, 2, -20, 1.2, 1.2, c);
            createPlat(-3, 3, -24, 1.2, 1.2, c);
            createCoin(-3, 4.5, -24);
            createPlat(0, 4, -29, 1, 1, c); // Sehr klein
            // Finales Ziel
            createPlat(0, 4, -36, 8, 8, 0xFFD700); // Goldenes Ziel
        }
    }

    // --- GAME LOOP & LOGIK ---
    function updatePhysics() {
        // 1. Bewegung (WASD)
        const moveDir = new THREE.Vector3(0, 0, 0);
        if (keyState['KeyW'] || keyState['ArrowUp']) moveDir.z -= 1;
        if (keyState['KeyS'] || keyState['ArrowDown']) moveDir.z += 1;
        if (keyState['KeyA'] || keyState['ArrowLeft']) moveDir.x -= 1;
        if (keyState['KeyD'] || keyState['ArrowRight']) moveDir.x += 1;

        // Springen
        if ((keyState['Space']) && canJump) {
            velocityY = jumpForce;
            canJump = false;
        }

        // Schwerkraft anwenden
        velocityY -= gravity;
        player.position.y += velocityY;
        player.position.add(moveDir.multiplyScalar(playerSpeed));

        // 2. Kollisionserkennung (einfache AABB Box)
        const playerBox = new THREE.Box3().setFromObject(player);
        // Wir machen die Box unten etwas kleiner für "Feet"-Detection
        const feetBox = new THREE.Box3(
            new THREE.Vector3(playerBox.min.x + 0.1, playerBox.min.y, playerBox.min.z + 0.1),
            new THREE.Vector3(playerBox.max.x - 0.1, playerBox.min.y + 0.5, playerBox.max.z - 0.1)
        );

        canJump = false; // Reset, wir prüfen gleich ob wir stehen

        for (let plat of platforms) {
            const platBox = new THREE.Box3().setFromObject(plat);
            
            // Bodenkollision (Lande auf Plattform)
            if (feetBox.intersectsBox(platBox) && velocityY <= 0) {
                // Nur landen wenn wir wirklich von oben kommen
                if (player.position.y > plat.position.y + 0.5) {
                    player.position.y = platBox.max.y + 0.5; // Aufsetzen (Spielerhöhe ist 1, also center + 0.5)
                    velocityY = 0;
                    canJump = true;
                }
            }
        }

        // 3. Coins sammeln
        for (let i = coins.length - 1; i >= 0; i--) {
            const coin = coins[i];
            coin.rotation.z += 0.05; // Animation
            
            if (player.position.distanceTo(coin.position) < 1.2) {
                scene.remove(coin);
                coins.splice(i, 1);
                score++;
                document.getElementById('scoreDisplay').innerText = score;
            }
        }

        // 4. Fall ins Leere (Respawn)
        if (player.position.y < -10) {
            player.position.set(0, 2, 0);
            velocityY = 0;
        }

        // 5. Level Ziel Check (Das letzte weiße/goldene Quadrat ist bei z < -30)
        if (player.position.z < -32 && canJump) {
            nextLevel();
        }
    }

    function updateCamera() {
        // Zielposition der Kamera relativ zum Spieler
        const targetPos = player.position.clone().add(cameraOffset);
        
        // Sanftes Mitschwingen (Lerp)
        camera.position.lerp(targetPos, cameraLerpFactor);
        
        // Kamera schaut immer auf den Spieler
        camera.lookAt(player.position);
    }

    function nextLevel() {
        if (activeLevel < 3) {
            activeLevel++;
            loadLevel(activeLevel);
        } else {
            // Spiel gewonnen
            document.getElementById('finalScore').innerText = score;
            document.getElementById('win-screen').style.display = 'block';
            // Stoppe Bewegung, um Chaos im Hintergrund zu vermeiden
            keyState = {}; 
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if (document.getElementById('win-screen').style.display !== 'block') {
            updatePhysics();
            updateCamera();
        }
        
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
